name: Build and Release DMG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: [macos, macos-runner]
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate Xcode
        run: |
          XCODE_PATH=$(mdfind "kMDItemCFBundleIdentifier == 'com.apple.dt.Xcode'" | head -n 1)
          if [ -z "$XCODE_PATH" ]; then XCODE_PATH="/Applications/Xcode.app"; fi
          echo "Found Xcode at $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> $GITHUB_ENV

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Archive App
        run: |
          xcodebuild archive \
            -project Lume.xcodeproj \
            -scheme Lume \
            -configuration Release \
            -archivePath ./build/Lume.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO



      - name: Code Sign with Developer Identity
        run: |
          APP="./build/Lume.xcarchive/Products/Applications/Lume.app"
          IDENTITY="Apple Development: custom.icon@vk.com (8UF52HAQA4)"

          echo "Signing with identity: $IDENTITY"
          codesign --force --deep --sign "$IDENTITY" \
            --options runtime \
            "$APP"

          codesign --verify --deep --strict "$APP"
          echo "Signing complete"

      # FIX 1 & 2: Prepare DMG — keep the Applications symlink this time
      - name: Prepare DMG Content
        run: |
          mkdir -p ./dmg_source
          cp -R ./build/Lume.xcarchive/Products/Applications/Lume.app ./dmg_source/

          # Applications symlink lets users drag-and-drop to install
          # NOTE: do NOT remove this before packing (that was the original bug)
          ln -s /Applications ./dmg_source/Applications

          echo "DMG staging contents:"
          ls -la ./dmg_source

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        run: |
          echo "Building hybrid image..."
          # makehybrid is more robust in restricted CI environments
          hdiutil makehybrid \
            -o Lume.dmg \
            -hfs \
            -hfs-volume-name "Lume" \
            -hfs-openfolder ./dmg_source \
            ./dmg_source
          
          echo "Converting to compressed DMG..."
          hdiutil convert Lume.dmg -format UDZO -ov -o Lume_final.dmg
          mv Lume_final.dmg Lume.dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Build ${{ github.sha }}
          body: |
            Automated build from commit ${{ github.sha }}
          files: Lume.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
